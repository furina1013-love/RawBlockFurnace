org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.249

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1.248,)

# Mod metadata（mod_id 与 @Mod 注解必须一致）
mod_id=raw_block_furnace
mod_name=Raw Block Furnace
mod_version=1.0.0
mod_group_id=com.rawblocksmelting
mod_authors=furina1013-love
mod_license=MIT
mod_description=Adds furnace recipes that smelt raw ore blocks into the corresponding blocks (vanilla and modded), plus AllTheCompressed compressed raw blocks into compressed blocks.
