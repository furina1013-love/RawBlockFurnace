name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mc1.21.1-neoforge
            dir: 1.21.1-neoforge
            java: 21
          - name: mc1.20.1-forge
            dir: 1.20.1-forge
            java: 17
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/neoformruntime
          key: gradle-${{ matrix.name }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ matrix.name }}-

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Release（一个 tag = 一个 Release，内含两版 jar）
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Normalize jar names
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp dist/mc1.21.1-neoforge/*.jar "out/raw_block_furnace-${VERSION}-mc1.21.1-neoforge.jar"
          cp dist/mc1.20.1-forge/*.jar   "out/raw_block_furnace-${VERSION}-mc1.20.1-forge.jar"
          ls -l out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.jar
          generate_release_notes: false
          body_path: docs/release-notes.md
